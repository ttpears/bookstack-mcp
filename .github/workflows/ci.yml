name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22: the test script passes a glob ('src/**/*.test.ts') to
          # `node --test`, and glob support in the test runner only landed in
          # Node 21. On Node 20 the pattern is treated as a literal path and
          # the run dies with "Could not find .../src/**/*.test.ts".
          # This is a dev-time constraint only — `engines` stays >=18 because
          # installing the package runs `prepare` (tsc build), never the tests.
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  # Build a preview image for non-draft PRs; push to GHCR only for same-repository
  # PRs so forks can validate the build without package write access. Uses the
  # GITHUB_TOKEN (no PAT) and amd64 only. Tag: branch-<slug>. Never publishes npm.
  docker-preview:
    needs: build
    # Drafts are for review only; publish preview images after the PR is ready.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        run: |
          slug=$(echo "${GITHUB_HEAD_REF}" | tr '[:upper:]/' '[:lower:]-' | tr -cs 'a-z0-9_.-' '-' | sed 's/^-*//;s/-*$//')
          echo "tag=branch-${slug}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ghcr.io/ttpears/bookstack-mcp:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Use a PAT so the tag push triggers release.yml.
          # The default GITHUB_TOKEN cannot trigger other workflows.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Tag if package.json version changed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists — skipping."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"
