name: HOL Guard

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate marketplace metadata
        run: node scripts/check-plugin.mjs

      - name: Scan plugin locally
        uses: hashgraph-online/ai-plugin-scanner-action@1fb7eef6f7387abd0512e91ee8f336ac8bf07c95 # v1.2.789
        with:
          plugin_dir: '.'
          mode: scan
          format: markdown
          output: '${{ runner.temp }}/hol-guard-report.md'
          # Scan all detected manifests, including the native Codex interface.
          # Missing marketplace policy links must block the PR.
          fail_on_severity: medium
          min_score: 95
          online: false
          install_cisco: false
          cisco_skill_scan: 'off'
          upload_sarif: false
          submission_enabled: false
          pr_comment: 'off'
