name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  # Both jobs below target the `release` environment, which has required
  # reviewers. Merging a version bump still auto-tags (see ci.yml), but nothing
  # reaches npm, GHCR, or GitHub Releases until a reviewer approves the run.
  # One approval unblocks every job in the run that targets the environment.
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 22: `npm install -g npm@latest` below pulls npm 12.x, which
          # requires Node >= 22.22 — on Node 20 it failed with EBADENGINE and
          # aborted the publish (the container image built regardless).
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node ships with npm 10.x
      - run: npm install -g npm@latest

      - name: Publish to npm with provenance
        # Uses npm trusted publishing via GitHub OIDC (id-token: write).
        # No NPM_TOKEN needed — the npm CLI exchanges the Actions OIDC token
        # for a short-lived registry token at publish time.
        run: npm publish --access public --provenance

      - name: Build MCPB bundle
        run: node scripts/build-mcpb.mjs

      - name: Create GitHub Release with MCPB asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            "bookstack-mcp-${VERSION}.mcpb#BookStack MCP — Claude Desktop / MCPB bundle"

  docker:
    name: Build and push container image
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR=$(echo "$VERSION" | awk -F. '{print $1"."$2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ttpears/bookstack-mcp:${{ steps.version.outputs.version }}
            ghcr.io/ttpears/bookstack-mcp:${{ steps.version.outputs.major_minor }}
            ghcr.io/ttpears/bookstack-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
