name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  # Both jobs below target the `release` environment, which has required
  # reviewers. Merging a version bump still auto-tags (see ci.yml), but nothing
  # reaches npm, GHCR, or GitHub Releases until a reviewer approves the run.
  # One approval unblocks every job in the run that targets the environment.
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22: `npm install -g npm@latest` below pulls npm 12.x, which
          # requires Node >= 22.22 — on Node 20 it failed with EBADENGINE and
          # aborted the publish (the container image built regardless).
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node ships with npm 10.x
      - run: npm install -g npm@latest

      - name: Publish to npm with provenance
        # Uses npm trusted publishing via GitHub OIDC (id-token: write).
        # No NPM_TOKEN needed — the npm CLI exchanges the Actions OIDC token
        # for a short-lived registry token at publish time.
        run: npm publish --access public --provenance

      - name: Build MCPB bundle
        run: node scripts/build-mcpb.mjs

      - name: Create GitHub Release with MCPB asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            "bookstack-mcp-${VERSION}.mcpb#BookStack MCP — Claude Desktop / MCPB bundle"

  docker:
    name: Build and push container image
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR=$(echo "$VERSION" | awk -F. '{print $1"."$2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ttpears/bookstack-mcp:${{ steps.version.outputs.version }}
            ghcr.io/ttpears/bookstack-mcp:${{ steps.version.outputs.major_minor }}
            ghcr.io/ttpears/bookstack-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
